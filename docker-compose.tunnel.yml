name: ghibiri-home

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ghibiri-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Imposta TUNNEL_TOKEN nel file .env}
    depends_on:
      ghibiri-home:
        condition: service_healthy
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
